services:
  postgres:
    image: postgres:16.6-alpine3.21
    environment:
      POSTGRES_DB: archers
      POSTGRES_USER: archers
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [stores]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archers -d archers"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARCHERS_CONFIG_FILE: /run/config/settings.yaml
      ARCHERS_DATABASE_URL_FILE: /run/secrets/database-url
      ARCHERS_OPERATOR_TOKEN_FILE: /run/secrets/operator-token
      ARCHERS_SIGNING_KEY_FILE: /run/secrets/signing-key
    volumes:
      - ./deploy/config/settings.compose.yaml:/run/config/settings.yaml:ro
      - ./deploy/secrets/database-url.txt:/run/secrets/database-url:ro
      - ./deploy/secrets/operator-token.txt:/run/secrets/operator-token:ro
      - ./deploy/secrets/signing-key.txt:/run/secrets/signing-key:ro
    command: ["archers", "migrate"]
    networks: [stores]

  api:
    extends:
      service: migrate
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - artifacts:/data
    command: ["archers", "api"]
    networks: [stores, frontend]

  watcher:
    extends:
      service: migrate
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - artifacts:/data
      - type: bind
        source: ./deploy/data/inbox
        target: /sources/inbox
        read_only: true
        bind:
          create_host_path: false
    command: ["archers", "watch"]
    networks: [stores]
    restart: on-failure

  worker:
    extends:
      service: migrate
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    volumes:
      - artifacts:/data
      - type: bind
        source: ./deploy/models/embedding
        target: /models/embedding
        read_only: true
        bind:
          create_host_path: false
    command: ["archers", "worker"]
    networks: [stores]
    restart: on-failure

  qdrant:
    image: qdrant/qdrant:v1.15.5
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    networks: [stores]

  prepare-source:
    extends:
      service: migrate
    profiles: [setup]
    user: "0:0"
    volumes:
      - type: bind
        source: ./deploy/data/inbox
        target: /sources/inbox
        bind:
          create_host_path: false
    command: ["archers", "source-init", "--mount-alias", "inbox"]
    networks: [stores]

  prepare-model:
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles: [setup]
    user: "0:0"
    volumes:
      - type: bind
        source: ./deploy/models/embedding
        target: /models/embedding
        bind:
          create_host_path: false
    command: ["archers", "download-model", "--directory", "/models/embedding"]
    networks: [model-preparation]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:8080"
    networks: [frontend]

secrets:
  postgres-password:
    file: ./deploy/secrets/postgres-password.txt

volumes:
  postgres-data:
  artifacts:
  qdrant-data:

networks:
  stores:
    internal: true
  frontend:
    internal: true
  model-preparation:
