openapi: 3.1.0
info:
  title: Self-hosted Document Knowledge Assistant API
  version: 0.2.0
  description: |
    Design contract, not an implemented service. All operations are under /api/v1.
    Session authentication is the default. x-permissions refer to security.md;
    these extensions document enforcement, they do not enforce it automatically.
    Current role, tenant, ownership, and lifecycle checks are mandatory server-side.
    Reject unknown request properties. Return UTC timestamps and UUID identifiers.
    Mutating session requests require X-CSRF-Token and trusted Origin validation.
    Login validates Origin and has its own rate limit. Internal operations use an
    operator bearer token and must not be proxied to the browser.
    Default Error responses cover 401, 403, 404, 409, 413, 422, 429, 503, and 504
    where applicable. Hidden protected resources use 404, not existence disclosure.
    If-Match carries a quoted resource revision; mismatch returns 409.
    Idempotency-Key is scoped to tenant, actor, method and path; conflicting
    request content with the same key returns 409. Never log request bodies.
    Preimplementation revision: ADR 0002 records expanded source configuration,
    multi-format citations and paid processing consent. Model profiles, endpoint
    allowlists and budgets are deployment-owned, not chat-supplied credentials.
servers:
  - url: /api/v1
security:
  - SessionCookie: []
paths:
  /auth/login:
    post:
      operationId: login
      security: []
      x-permissions: [anonymous.login]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Login succeeded; opaque HttpOnly session cookie issued.
          headers:
            Set-Cookie: {schema: {type: string}, description: 'rag_session; HttpOnly; SameSite=Lax; Secure under TLS.'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionInfo'}
        default: {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      operationId: logout
      x-permissions: [session.own]
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      responses:
        '204': {description: Session revoked and cookie expired.}
        default: {$ref: '#/components/responses/Error'}
  /auth/me:
    get:
      operationId: getSession
      x-permissions: [session.own]
      responses:
        '200':
          description: Current server-derived role and effective permissions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionInfo'}
        default: {$ref: '#/components/responses/Error'}
  /admin/users:
    get:
      operationId: listUsers
      x-permissions: [users.manage]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Tenant-local account page; no password/session material.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createUser
      x-permissions: [users.manage]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Idempotency'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUser'}
      responses:
        '201':
          description: User provisioned without exposing password hash.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}
  /admin/users/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch:
      operationId: updateUser
      x-permissions: [users.manage]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Revision'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateUser'}
      responses:
        '200':
          description: Updated; role/password/status changes revoke sessions and pending runs.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        default: {$ref: '#/components/responses/Error'}
  /admin/sources:
    get:
      operationId: listSources
      x-permissions: [sources.manage]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Approved source configurations in this tenant.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourcePage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createSource
      x-permissions: [sources.manage]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Idempotency'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateSource'}
      responses:
        '201':
          description: Source registered against an approved typed connector scope and format policy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
  /admin/sources/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch:
      operationId: updateSource
      x-permissions: [sources.manage]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Revision'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateSource'}
      responses:
        '200':
          description: Source enabled/paused or policy updated; pause is not deletion.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}/status:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getSourceStatus
      x-permissions: [sources.observe]
      responses:
        '200':
          description: Scan health, deferred snapshot backlog and file errors, without credentials. Automatic withdrawal currently remains frozen.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceStatus'}
        default: {$ref: '#/components/responses/Error'}
  /sources/{id}/rescan:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: rescanSource
      x-permissions: [sources.rescan]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Idempotency'}]
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        default: {$ref: '#/components/responses/Error'}
  /admin/sources/{id}/deletion-review:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: reviewSourceDeletion
      x-permissions: [sources.manage]
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeletionReview'}
      responses:
        '202':
          description: Fresh reconciliation queued; approval cannot bypass failed health checks.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AcceptedJob'}
        '200':
          description: Alert rejected; withdrawal remains frozen.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SourceStatus'}
        default: {$ref: '#/components/responses/Error'}
  /documents:
    get:
      operationId: listDocuments
      x-permissions: [documents.read]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Active tenant corpus; includes general source freshness warnings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: uploadDocument
      x-permissions: [ingestion.manage]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Idempotency'}]
      requestBody: {$ref: '#/components/requestBodies/DocumentUpload'}
      responses:
        '202': {$ref: '#/components/responses/IngestionAccepted'}
        default: {$ref: '#/components/responses/Error'}
  /documents/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getDocument
      x-permissions: [documents.read]
      description: Readers get active metadata; curator/admin may inspect processing state.
      responses:
        '200':
          description: Authorized document metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      operationId: withdrawDocument
      x-permissions: [documents.withdraw]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Revision'}]
      description: Immediate logical withdrawal; source-managed documents stay suppressed across rescans.
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        default: {$ref: '#/components/responses/Error'}
  /documents/{id}/versions:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: replaceManualDocument
      x-permissions: [ingestion.manage]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Idempotency'}, {$ref: '#/components/parameters/Revision'}]
      description: Manual documents only; any source-managed document returns 409.
      requestBody: {$ref: '#/components/requestBodies/DocumentUpload'}
      responses:
        '202': {$ref: '#/components/responses/IngestionAccepted'}
        default: {$ref: '#/components/responses/Error'}
  /documents/{id}/review:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: reviewExtraction
      x-permissions: [ingestion.manage]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Revision'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExtractionReview'}
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        '200':
          description: Extraction rejected; version remains unpublished.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReviewOutcome'}
        default: {$ref: '#/components/responses/Error'}
  /documents/{id}/restore:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: restoreSourceDocument
      x-permissions: [documents.withdraw]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Revision'}]
      description: Restore a suppressed source document through a fresh snapshot; no stale resurrection.
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        default: {$ref: '#/components/responses/Error'}
  /documents/{id}/versions/{version_id}/source:
    parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/VersionId'}]
    get:
      operationId: getSourcePdf
      x-permissions: [documents.read]
      parameters:
        - name: Range
          in: header
          schema: {type: string}
          description: Single byte range; invalid/unsatisfiable ranges return 416.
      description: Retained PDF-only route; non-PDF returns 422. Reauthorize lifecycle/version retention.
      responses:
        '200':
          description: Original immutable PDF snapshot.
          headers:
            Accept-Ranges: {schema: {type: string, const: bytes}}
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '206':
          description: Authorized partial PDF.
          headers:
            Content-Range: {required: true, schema: {type: string}}
          content:
            application/pdf:
              schema: {type: string, format: binary}
        '416': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /jobs/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getJob
      x-permissions: [ingestion.manage]
      responses:
        '200':
          description: Tenant-local job, stage and safe failure details.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        default: {$ref: '#/components/responses/Error'}
  /jobs/{id}/retry:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: retryJob
      x-permissions: [ingestion.manage]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Idempotency'}]
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        default: {$ref: '#/components/responses/Error'}
  /jobs/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: cancelJob
      x-permissions: [ingestion.manage]
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      responses:
        '202':
          description: Cancellation requested; not a claim that work has already stopped.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Job'}
        default: {$ref: '#/components/responses/Error'}
  /conversations:
    get:
      operationId: listConversations
      x-permissions: [conversations.own]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200':
          description: Only the current user's conversations.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConversationPage'}
        default: {$ref: '#/components/responses/Error'}
    post:
      operationId: createConversation
      x-permissions: [conversations.own]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Idempotency'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateConversation'}
      responses:
        '201':
          description: Created for current user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{id}/messages:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: listMessages
      x-permissions: [conversations.own]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      description: Reauthorize evidence. Redact source-dependent bodies when no longer available.
      responses:
        '200':
          description: Owner's history; unavailable evidence never leaks stale answer text.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MessagePage'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    delete:
      operationId: deleteConversation
      x-permissions: [conversations.own]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Revision'}]
      responses:
        '202': {$ref: '#/components/responses/JobAccepted'}
        default: {$ref: '#/components/responses/Error'}
  /conversations/{id}/runs:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: createRun
      x-permissions: [query, conversations.own]
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      description: Deduplicate client_request_id within conversation; different content returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRun'}
      responses:
        '202':
          description: Queued run; subscribe separately, do not replay POST to reconnect.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunAccepted'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getRun
      x-permissions: [conversations.own]
      responses:
        '200':
          description: Current status or terminal result, reauthorized on read.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        default: {$ref: '#/components/responses/Error'}
  /runs/{id}/events:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: streamRunEvents
      x-permissions: [conversations.own]
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string, pattern: '^[0-9]+$'}
      description: |
        SSE with increasing per-run integer IDs and JSON data. Event names are
        progress, completed, error, cancelled (see RunEvent). Only completed
        contains a validated result (answered or abstained). Heartbeat comments
        every 15 s. Persist before delivery; replay after Last-Event-ID, never
        rerun generation. Expired replay history returns 409 EVENT_HISTORY_EXPIRED;
        recover via GET run. Disconnect does not cancel. Revalidate session and
        authorization during the stream and before emitting sensitive data.
        After headers, failures are error events, not fake HTTP status changes.
      responses:
        '200':
          description: SSE event stream; no draft answer tokens.
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /runs/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: cancelRun
      x-permissions: [conversations.own]
      parameters: [{$ref: '#/components/parameters/Csrf'}]
      responses:
        '202':
          description: Cancellation requested; current run status returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        default: {$ref: '#/components/responses/Error'}
  /messages/{id}/feedback:
    parameters: [{$ref: '#/components/parameters/Id'}]
    post:
      operationId: createFeedback
      x-permissions: [feedback.own]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Idempotency'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFeedback'}
      responses:
        '201':
          description: Feedback for an authorized assistant message in own conversation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Feedback'}
        default: {$ref: '#/components/responses/Error'}
  /health/live:
    get:
      operationId: liveness
      security: []
      x-permissions: [anonymous.liveness]
      responses:
        '200':
          description: Process is alive; no version, model, or infrastructure disclosure.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
  /health/ready:
    get:
      operationId: readiness
      security: [{OperatorToken: []}]
      x-permissions: [operator]
      responses:
        '200':
          description: Dependencies and exact preloaded assets ready.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /metrics:
    get:
      operationId: getMetrics
      security: [{OperatorToken: []}]
      x-permissions: [operator]
      responses:
        '200':
          description: Local metrics without content or user/document-ID labels.
          content:
            text/plain:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /admin/model-policy:
    get:
      operationId: getModelPolicy
      x-permissions: [model_policy.observe]
      responses:
        '200':
          description: Redacted effective deployment policy; no runtime credential or egress enablement.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelPolicy'}
        default: {$ref: '#/components/responses/Error'}
  /admin/model-usage:
    get:
      operationId: getModelUsage
      x-permissions: [model_policy.observe]
      responses:
        '200':
          description: Current UTC monthly usage/reservations; no prompt or billing secrets.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelUsage'}
        default: {$ref: '#/components/responses/Error'}
  /documents/{id}/export-policy:
    parameters: [{$ref: '#/components/parameters/Id'}]
    put:
      operationId: setManualDocumentExportPolicy
      x-permissions: [export.manage]
      parameters: [{$ref: '#/components/parameters/Csrf'}, {$ref: '#/components/parameters/Revision'}]
      description: Manual documents only; source export uses source config. Deployment deny always wins.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportPolicy'}
      responses:
        '200':
          description: Audited policy revision; revocation invalidates remote pending work.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        default: {$ref: '#/components/responses/Error'}
  /documents/{id}/versions/{version_id}/original:
    parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/VersionId'}]
    get:
      operationId: downloadOriginal
      x-permissions: [documents.read]
      description: Authenticated immutable original; attachment disposition, never execute HTML/macros.
      responses:
        '200':
          description: Original allowed-format file bytes.
          headers:
            Content-Disposition: {required: true, schema: {type: string}}
            X-Content-Type-Options: {schema: {type: string, const: nosniff}}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Error'}
  /documents/{id}/versions/{version_id}/view:
    parameters: [{$ref: '#/components/parameters/Id'}, {$ref: '#/components/parameters/VersionId'}]
    get:
      operationId: getNormalizedView
      x-permissions: [documents.read]
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      description: Safe normalized blocks with stable locations; no active HTML/formulas or external subresources.
      responses:
        '200':
          description: Evidence blocks tied to immutable source version.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NormalizedView'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    SessionCookie: {type: apiKey, in: cookie, name: rag_session}
    OperatorToken: {type: http, scheme: bearer, description: Deployment-managed internal operator secret; not a user session.}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    VersionId: {name: version_id, in: path, required: true, schema: {type: string, format: uuid}}
    Csrf: {name: X-CSRF-Token, in: header, required: true, schema: {type: string, minLength: 1}}
    Idempotency: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    Revision: {name: If-Match, in: header, required: true, schema: {type: string, pattern: '^"[1-9][0-9]*"$'}}
    Cursor: {name: cursor, in: query, schema: {type: string, maxLength: 512}, description: Opaque server cursor bound to tenant/requester/filter context.}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
  requestBodies:
    DocumentUpload:
      required: true
      description: Allowlisted formats; provisional 100 MiB, PDF 1000 pages, plus parser-specific archive/cell/row/resource limits.
      content:
        multipart/form-data:
          schema:
            type: object
            additionalProperties: false
            required: [file, title]
            properties:
              file: {type: string, format: binary}
              title: {type: string, minLength: 1, maxLength: 300}
  responses:
    Error:
      description: |
        Typed failure, not an abstention. Common codes include UNAUTHENTICATED,
        FORBIDDEN, NOT_FOUND, REVISION_CONFLICT, SOURCE_MANAGED, PDF_ENCRYPTED,
        PDF_INVALID, UPLOAD_TOO_LARGE, VALIDATION_ERROR, RATE_LIMITED,
        MODEL_UNAVAILABLE, DEPENDENCY_UNAVAILABLE, DEADLINE_EXCEEDED,
        AUTHORIZATION_CHANGED, EVENT_HISTORY_EXPIRED, EXTERNAL_PROCESSING_NOT_APPROVED,
        BUDGET_EXCEEDED, PROVIDER_CAPABILITY_UNSUPPORTED. Use appropriate HTTP status.
        Export refusal uses 403, unsupported profile uses 422, budget overflow 429.
        429 includes Retry-After; no stack traces, secret paths or raw content.
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}, description: Required on 429.}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    JobAccepted:
      description: Durable job accepted; not a claim of completed processing.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AcceptedJob'}
    IngestionAccepted:
      description: Durable document/version/job linkage created after snapshot finalization.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AcceptedIngestion'}
  schemas:
    Role: {type: string, enum: [reader, curator, admin]}
    Permission:
      type: string
      enum: [query, documents.read, conversations.own, feedback.own, ingestion.manage, sources.observe, sources.rescan, users.manage, sources.manage, documents.withdraw, model_policy.observe, export.manage]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 128}
        password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
    SessionInfo:
      type: object
      additionalProperties: false
      required: [user, permissions, csrf_token, expires_at]
      properties:
        user: {$ref: '#/components/schemas/User'}
        permissions: {type: array, uniqueItems: true, items: {$ref: '#/components/schemas/Permission'}}
        csrf_token: {type: string, minLength: 1}
        expires_at: {type: string, format: date-time}
    User:
      type: object
      additionalProperties: false
      required: [id, username, role, disabled, revision]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        role: {$ref: '#/components/schemas/Role'}
        disabled: {type: boolean}
        revision: {type: integer, minimum: 1}
    CreateUser:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username: {type: string, minLength: 1, maxLength: 128}
        password: {type: string, minLength: 15, maxLength: 1024, writeOnly: true}
        role: {$ref: '#/components/schemas/Role'}
    UpdateUser:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: {$ref: '#/components/schemas/Role'}
        disabled: {type: boolean}
        password: {type: string, minLength: 15, maxLength: 1024, writeOnly: true}
    UserPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/User'}}
        next_cursor: {type: [string, 'null']}
    ScanPolicy:
      type: object
      additionalProperties: false
      description: Provisional defaults; hard safety gates cannot be bypassed. Remote sources use remote_revision with certified reads.
      required: [poll_seconds, stable_seconds, deletion_grace_seconds, completion_mode]
      properties:
        poll_seconds: {type: integer, minimum: 1, default: 30}
        stable_seconds: {type: integer, minimum: 1, default: 60}
        deletion_grace_seconds: {type: integer, minimum: 1, default: 300}
        completion_mode: {type: string, enum: [atomic_rename, ready_manifest, heuristic_double_hash, remote_revision]}
    Format:
      type: string
      enum: [pdf, docx, pptx, xlsx, markdown, text, html, csv]
    ExportPolicy:
      type: object
      additionalProperties: false
      required: [allow_external_generation, allow_external_embeddings]
      properties:
        allow_external_generation: {type: boolean, default: false}
        allow_external_embeddings: {type: boolean, default: false}
    ConnectorConfig:
      oneOf:
        - {$ref: '#/components/schemas/FilesystemConfig'}
        - {$ref: '#/components/schemas/S3Config'}
        - {$ref: '#/components/schemas/GraphConfig'}
        - {$ref: '#/components/schemas/DriveConfig'}
      discriminator:
        propertyName: kind
        mapping:
          filesystem: '#/components/schemas/FilesystemConfig'
          s3: '#/components/schemas/S3Config'
          sharepoint: '#/components/schemas/GraphConfig'
          google_drive: '#/components/schemas/DriveConfig'
    FilesystemConfig:
      type: object
      additionalProperties: false
      required: [kind, mount_alias, sentinel_id]
      properties:
        kind: {type: string, const: filesystem}
        mount_alias: {type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
        sentinel_id: {type: string, format: uuid}
    S3Config:
      type: object
      additionalProperties: false
      required: [kind, endpoint_alias, bucket, prefix, credential_ref]
      properties:
        kind: {type: string, const: s3}
        endpoint_alias: {type: string, minLength: 1}
        bucket: {type: string, minLength: 1}
        prefix: {type: string}
        credential_ref: {type: string, minLength: 1}
    GraphConfig:
      type: object
      additionalProperties: false
      required: [kind, directory_tenant_id, site_or_drive_id, folder_id, credential_ref]
      properties:
        kind: {type: string, const: sharepoint}
        directory_tenant_id: {type: string, minLength: 1}
        site_or_drive_id: {type: string, minLength: 1}
        folder_id: {type: string, minLength: 1}
        credential_ref: {type: string, minLength: 1}
    DriveConfig:
      type: object
      additionalProperties: false
      required: [kind, drive_id, folder_id, credential_ref]
      properties:
        kind: {type: string, const: google_drive}
        drive_id: {type: string, minLength: 1}
        folder_id: {type: string, minLength: 1}
        credential_ref: {type: string, minLength: 1}
    CreateSource:
      type: object
      additionalProperties: false
      description: Server explicitly sets both export flags false when export_policy is omitted; JSON Schema defaults do not apply values.
      required: [connector, formats, enabled, scan_policy]
      properties:
        connector: {$ref: '#/components/schemas/ConnectorConfig'}
        formats: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Format'}}
        export_policy: {$ref: '#/components/schemas/ExportPolicy'}
        enabled: {type: boolean}
        scan_policy: {$ref: '#/components/schemas/ScanPolicy'}
    UpdateSource:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        enabled: {type: boolean}
        scan_policy: {$ref: '#/components/schemas/ScanPolicy'}
        formats: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Format'}}
        export_policy: {$ref: '#/components/schemas/ExportPolicy'}
    Source:
      type: object
      additionalProperties: false
      required: [id, connector, formats, export_policy, enabled, revision, scan_policy]
      properties:
        id: {type: string, format: uuid}
        connector: {$ref: '#/components/schemas/ConnectorConfig'}
        formats: {type: array, minItems: 1, uniqueItems: true, items: {$ref: '#/components/schemas/Format'}}
        export_policy: {$ref: '#/components/schemas/ExportPolicy'}
        enabled: {type: boolean}
        revision: {type: integer, minimum: 1}
        scan_policy: {$ref: '#/components/schemas/ScanPolicy'}
    SourcePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Source'}}
        next_cursor: {type: [string, 'null']}
    SourceStatus:
      type: object
      additionalProperties: false
      required: [source_id, health, last_healthy_scan_at, snapshot_backlog, tracked_files, missing_files, deletion_frozen, deletion_alert_revision]
      properties:
        source_id: {type: string, format: uuid}
        health: {type: string, enum: [unknown, healthy, degraded, unavailable, paused]}
        last_healthy_scan_at: {type: [string, 'null'], format: date-time}
        snapshot_backlog: {type: integer, minimum: 0}
        tracked_files: {type: integer, minimum: 0}
        missing_files: {type: integer, minimum: 0}
        deletion_frozen: {type: boolean}
        deletion_alert_revision: {type: [integer, 'null'], minimum: 1}
        error_code: {type: [string, 'null'], description: Sanitized scanner error or warning code.}
        file_errors: {type: integer, minimum: 0, description: Files with deferred acceptance errors.}
    DeletionReview:
      type: object
      additionalProperties: false
      required: [alert_revision, decision, reason]
      properties:
        alert_revision: {type: integer, minimum: 1}
        decision: {type: string, enum: [approve, reject]}
        reason: {type: string, minLength: 1, maxLength: 2000}
    Document:
      type: object
      additionalProperties: false
      required: [id, title, origin, availability, revision, active_version_id, format, export_policy]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        origin: {type: string, enum: [manual, nas, connector]}
        format: {$ref: '#/components/schemas/Format'}
        export_policy: {$ref: '#/components/schemas/ExportPolicy'}
        availability: {type: string, enum: [PENDING, ACTIVE, SOURCE_DELETED, SUPPRESSED, DELETED]}
        revision: {type: integer, minimum: 1}
        active_version_id: {type: [string, 'null'], format: uuid}
    DocumentPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, warnings]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Document'}}
        next_cursor: {type: [string, 'null']}
        warnings: {type: array, items: {type: string}}
    ExtractionReview:
      type: object
      additionalProperties: false
      required: [version_id, decision, reason]
      properties:
        version_id: {type: string, format: uuid}
        decision: {type: string, enum: [accept, reject]}
        reason: {type: string, minLength: 1, maxLength: 2000}
    ReviewOutcome:
      type: object
      additionalProperties: false
      required: [version_id, decision]
      properties:
        version_id: {type: string, format: uuid}
        decision: {type: string, const: reject}
    AcceptedJob:
      type: object
      additionalProperties: false
      required: [job_id]
      properties:
        job_id: {type: string, format: uuid}
        document_id: {type: string, format: uuid}
        version_id: {type: string, format: uuid}
      description: Ingestion acceptance includes document_id and version_id; other jobs may omit them.
    AcceptedIngestion:
      allOf:
        - {$ref: '#/components/schemas/AcceptedJob'}
        - required: [document_id, version_id]
    Job:
      type: object
      additionalProperties: false
      required: [id, kind, status, stage, attempts, cancel_requested, error]
      properties:
        id: {type: string, format: uuid}
        kind: {type: string, enum: [scan, snapshot, ingest, cleanup]}
        status: {type: string, enum: [PENDING, RUNNING, RETRY_WAIT, SUCCEEDED, FAILED, CANCELLED]}
        stage: {type: [string, 'null']}
        attempts: {type: integer, minimum: 0}
        cancel_requested: {type: boolean}
        error: {oneOf: [{$ref: '#/components/schemas/ErrorDetail'}, {type: 'null'}]}
        quality_report: {$ref: '#/components/schemas/QualityReport'}
    QualityReport:
      type: object
      additionalProperties: false
      required: [version_id, review_required, issues]
      properties:
        version_id: {type: string, format: uuid}
        review_required: {type: boolean}
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [code, locations, message]
            properties:
              code: {type: string}
              locations: {type: array, items: {$ref: '#/components/schemas/SourceLocation'}}
              message: {type: string}
    CreateConversation:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
    Conversation:
      type: object
      additionalProperties: false
      required: [id, title, revision, created_at]
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
    ConversationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Conversation'}}
        next_cursor: {type: [string, 'null']}
    CreateRun:
      type: object
      additionalProperties: false
      description: Server explicitly treats omitted external_processing_consent as false.
      required: [question, client_request_id]
      properties:
        question: {type: string, minLength: 1, maxLength: 16000}
        client_request_id: {type: string, format: uuid}
        external_processing_consent: {type: boolean, default: false}
    RunAccepted:
      type: object
      additionalProperties: false
      required: [run_id, events_url]
      properties:
        run_id: {type: string, format: uuid}
        events_url: {type: string, pattern: '^/api/v1/runs/[^/]+/events$'}
    Citation:
      type: object
      additionalProperties: false
      required: [source_id, document_id, version_id, chunk_id, title, source_url]
      properties:
        source_id: {type: string, pattern: '^S[1-9][0-9]*$'}
        document_id: {type: string, format: uuid}
        version_id: {type: string, format: uuid}
        chunk_id: {type: string, format: uuid}
        title: {type: string}
        pdf_pages: {type: array, minItems: 1, uniqueItems: true, items: {type: integer, minimum: 1}}
        locations: {type: array, minItems: 1, items: {$ref: '#/components/schemas/SourceLocation'}}
        source_url: {type: string, pattern: '^/api/v1/documents/[^/]+/versions/[^/]+/(source|original|view)$'}
      anyOf:
        - required: [pdf_pages]
        - required: [locations]
      description: Legacy PDF page citations retained; new adapters emit locations. Never fabricate pages for non-PDF.
    SourceLocation:
      oneOf:
        - {$ref: '#/components/schemas/PdfLocation'}
        - {$ref: '#/components/schemas/SlideLocation'}
        - {$ref: '#/components/schemas/SheetLocation'}
        - {$ref: '#/components/schemas/LineLocation'}
        - {$ref: '#/components/schemas/RowLocation'}
        - {$ref: '#/components/schemas/BlockLocation'}
    PdfLocation:
      type: object
      additionalProperties: false
      required: [kind, page]
      properties:
        kind: {type: string, const: pdf_page}
        page: {type: integer, minimum: 1}
        block_id: {type: string}
    SlideLocation:
      type: object
      additionalProperties: false
      required: [kind, slide]
      properties:
        kind: {type: string, const: slide}
        slide: {type: integer, minimum: 1}
        block_id: {type: string}
    SheetLocation:
      type: object
      additionalProperties: false
      required: [kind, sheet, cell_range]
      properties:
        kind: {type: string, const: sheet_cells}
        sheet: {type: string, minLength: 1}
        cell_range: {type: string, minLength: 1}
    LineLocation:
      type: object
      additionalProperties: false
      required: [kind, start, end]
      properties:
        kind: {type: string, const: lines}
        start: {type: integer, minimum: 1}
        end: {type: integer, minimum: 1}
      description: Domain validates end >= start and both within snapshot.
    RowLocation:
      type: object
      additionalProperties: false
      required: [kind, start, end]
      properties:
        kind: {type: string, const: rows}
        start: {type: integer, minimum: 1}
        end: {type: integer, minimum: 1}
        columns: {type: array, items: {type: string}}
      description: Domain validates ranges against source snapshot.
    BlockLocation:
      type: object
      additionalProperties: false
      required: [kind, block_id]
      properties:
        kind: {type: string, const: block}
        block_id: {type: string, minLength: 1}
        section: {type: string}
    NormalizedView:
      type: object
      additionalProperties: false
      required: [document_id, version_id, format, blocks, next_cursor]
      properties:
        document_id: {type: string, format: uuid}
        version_id: {type: string, format: uuid}
        format: {$ref: '#/components/schemas/Format'}
        next_cursor: {type: [string, 'null']}
        blocks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, text, locations]
            properties:
              id: {type: string}
              text: {type: string}
              locations: {type: array, minItems: 1, items: {$ref: '#/components/schemas/SourceLocation'}}
    ModelPolicy:
      type: object
      additionalProperties: false
      required: [revision, network_mode, generation, embeddings, reranking]
      properties:
        revision: {type: integer, minimum: 1}
        network_mode: {type: string, enum: [airgap, connected_sources, external_models]}
        generation: {$ref: '#/components/schemas/ModelProfileSummary'}
        embeddings: {$ref: '#/components/schemas/ModelProfileSummary'}
        reranking: {type: string, const: local}
    ModelProfileSummary:
      type: object
      additionalProperties: false
      required: [profile_id, revision, provider, model, external, approved]
      properties:
        profile_id: {type: string}
        revision: {type: integer, minimum: 1}
        provider: {type: string, enum: [local, openai, azure_openai, anthropic, google_gemini, openai_compatible]}
        model: {type: string}
        external: {type: boolean}
        approved: {type: boolean}
      description: No keys/endpoint secrets. Domain verifies provider supports selected capability.
    ModelUsage:
      type: object
      additionalProperties: false
      description: Disjoint current-month buckets; confirmed/estimated settled charges exclude active reservations. Unknown billed calls remain reserved until reconciliation, never double-counted.
      required: [month_utc, currency, allowance_microunits, reserved_microunits, confirmed_microunits, estimated_microunits]
      properties:
        month_utc: {type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'}
        currency: {type: string, const: USD}
        allowance_microunits: {type: integer, minimum: 0}
        reserved_microunits: {type: integer, minimum: 0}
        confirmed_microunits: {type: integer, minimum: 0}
        estimated_microunits: {type: integer, minimum: 0}
    Answered:
      type: object
      additionalProperties: false
      required: [run_id, status, answer, citations, warnings]
      properties:
        run_id: {type: string, format: uuid}
        status: {type: string, const: answered}
        answer: {type: string, minLength: 1}
        citations: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Citation'}}
        warnings: {type: array, items: {type: string}}
    Abstained:
      type: object
      additionalProperties: false
      required: [run_id, status, reason, message, citations, warnings]
      properties:
        run_id: {type: string, format: uuid}
        status: {type: string, const: abstained}
        reason: {type: string, enum: [INSUFFICIENT_EVIDENCE, UNSUPPORTED_ANSWER, INVALID_MODEL_OUTPUT]}
        message: {type: string}
        citations: {type: array, maxItems: 0, items: {$ref: '#/components/schemas/Citation'}}
        warnings: {type: array, items: {type: string}}
    PendingRun:
      type: object
      additionalProperties: false
      required: [run_id, status, cancel_requested]
      properties:
        run_id: {type: string, format: uuid}
        status: {type: string, enum: [queued, running]}
        cancel_requested: {type: boolean}
    FailedRun:
      type: object
      additionalProperties: false
      required: [run_id, status, error]
      properties:
        run_id: {type: string, format: uuid}
        status: {type: string, const: failed}
        error: {$ref: '#/components/schemas/ErrorDetail'}
    CancelledRun:
      type: object
      additionalProperties: false
      required: [run_id, status]
      properties:
        run_id: {type: string, format: uuid}
        status: {type: string, const: cancelled}
    Run:
      oneOf:
        - {$ref: '#/components/schemas/PendingRun'}
        - {$ref: '#/components/schemas/Answered'}
        - {$ref: '#/components/schemas/Abstained'}
        - {$ref: '#/components/schemas/FailedRun'}
        - {$ref: '#/components/schemas/CancelledRun'}
    RunEvent:
      description: Logical SSE event record; data is the JSON payload after the SSE data prefix.
      oneOf:
        - {$ref: '#/components/schemas/ProgressEvent'}
        - {$ref: '#/components/schemas/CompletedEvent'}
        - {$ref: '#/components/schemas/ErrorEvent'}
        - {$ref: '#/components/schemas/CancelledEvent'}
    ProgressEvent:
      type: object
      additionalProperties: false
      required: [id, event, data]
      properties:
        id: {type: integer, minimum: 1}
        event: {type: string, const: progress}
        data:
          type: object
          additionalProperties: false
          required: [run_id, stage]
          properties:
            run_id: {type: string, format: uuid}
            stage: {type: string, enum: [authorizing, resolving, retrieving, reranking, generating, validating, finalizing]}
    CompletedEvent:
      type: object
      additionalProperties: false
      required: [id, event, data]
      properties:
        id: {type: integer, minimum: 1}
        event: {type: string, const: completed}
        data: {oneOf: [{$ref: '#/components/schemas/Answered'}, {$ref: '#/components/schemas/Abstained'}]}
    ErrorEvent:
      type: object
      additionalProperties: false
      required: [id, event, data]
      properties:
        id: {type: integer, minimum: 1}
        event: {type: string, const: error}
        data: {$ref: '#/components/schemas/FailedRun'}
    CancelledEvent:
      type: object
      additionalProperties: false
      required: [id, event, data]
      properties:
        id: {type: integer, minimum: 1}
        event: {type: string, const: cancelled}
        data: {$ref: '#/components/schemas/CancelledRun'}
    Message:
      type: object
      additionalProperties: false
      required: [id, role, status, content, citations, created_at]
      properties:
        id: {type: string, format: uuid}
        role: {type: string, enum: [user, assistant]}
        status: {type: string, enum: [available, redacted]}
        content: {type: [string, 'null']}
        citations: {type: array, items: {$ref: '#/components/schemas/Citation'}}
        created_at: {type: string, format: date-time}
      description: Redacted messages must have null content and no citations.
      allOf:
        - if:
            properties:
              status: {const: redacted}
            required: [status]
          then:
            properties:
              content: {type: 'null'}
              citations: {maxItems: 0}
          else:
            properties:
              content: {type: string}
    MessagePage:
      type: object
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Message'}}
        next_cursor: {type: [string, 'null']}
    CreateFeedback:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating: {type: string, enum: [helpful, unhelpful]}
        comment: {type: string, maxLength: 2000}
    Feedback:
      type: object
      additionalProperties: false
      required: [id, message_id, rating]
      properties:
        id: {type: string, format: uuid}
        message_id: {type: string, format: uuid}
        rating: {type: string, enum: [helpful, unhelpful]}
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code: {type: string, pattern: '^[A-Z][A-Z0-9_]*$'}
        message: {type: string}
        request_id: {type: string, format: uuid}
        retryable: {type: boolean}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorDetail'}
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: ok}
