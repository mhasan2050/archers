{{- range $component := list "api" "web" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "archers.name" $ }}-{{ $component }}
  labels:
    {{- include "archers.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name | quote }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: http
      port: {{ if eq $component "api" }}8000{{ else }}8080{{ end }}
      targetPort: http
{{- end }}
