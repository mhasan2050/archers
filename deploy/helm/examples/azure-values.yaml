# Replace every example reference; no cloud resources are provisioned by this chart.
images:
  backend: REGISTRY.azurecr.io/archers-backend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  web: REGISTRY.azurecr.io/archers-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
existingSecret: archers-runtime
storage:
  artifactsClaim: archers-artifacts-azurefiles-nfs
  modelClaim: archers-model-azurefiles-nfs
application:
  origin: https://archers.internal.example
  qdrantUrl: http://qdrant.internal.example:6333
source:
  enabled: true
  existingClaim: archers-source-azurefiles-nfs
  healthClaim: archers-source-health-azurefiles-nfs
networkPolicy:
  databaseCidrs: [10.30.10.0/24]
  qdrantCidrs: [10.30.11.20/32]
  # Example for a pod-based ingress-nginx controller behind an internal Azure LB.
  ingressNamespaceLabels: {kubernetes.io/metadata.name: ingress-nginx}
  ingressPodLabels: {app.kubernetes.io/name: ingress-nginx, app.kubernetes.io/component: controller}
ingress:
  enabled: true
  className: nginx
  host: archers.internal.example
  tlsSecretName: archers-tls
  # Set true only after verifying the existing controller's LB is private.
  privateAccessConfirmed: false
