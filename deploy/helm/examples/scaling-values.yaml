# Experimental overlay. Apply only after reviewing storage, DB capacity and tests.
storage:
  sharedArtifactsConfirmed: true
scaling:
  acknowledgeUncertified: true
  workerReplicaLimit: 2
  # 2 APIs + 2 workers + 1 watcher + 1 migration, conservatively 15 connections each.
  databaseConnectionBudget: 90
api:
  autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 2, targetCPUUtilizationPercentage: 70}
web:
  autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 2, targetCPUUtilizationPercentage: 70}
worker:
  autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 2, targetCPUUtilizationPercentage: 70}
